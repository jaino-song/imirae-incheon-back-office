# expansion in production runtime code. Revisit when minimatch ships releases
# on brace-expansion >=5.0.8 (then drop this entry and the override).
reason = "No patched 1.x/2.x release exists; 5.x pinned to 5.0.8; vulnerable path only reachable via developer-authored glob patterns in build tooling, not untrusted input."
