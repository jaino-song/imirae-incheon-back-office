name: Frontend Playwright Auth Lifecycle

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev, preview]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: frontend auth lifecycle · real backend
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres@localhost:5432/postgres
      DEVELOPMENT_API_BASE_URL: http://localhost:3001
      DEVELOPMENT_FRONTEND_URL: http://localhost:3000
      DEVELOPMENT_MOBILE_FRONTEND_URL: http://localhost:3002
      JWT_SECRET: e2e-dummy-jwt-signing-key-at-least-32-${{ github.run_id }}
      AUTH_EMAIL_TOKEN_HMAC_SECRET: e2e-dummy-email-hmac-${{ github.run_id }}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      VALKEY_URL: redis://localhost:6379
      E2E_VENDOR_STUBS: '1'
      NODE_ENV: development
      STORAGE_BOOTSTRAP_DISABLED: '1'
    services:
      postgres:
        image: postgres@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109 # postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84 # valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68 # axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter ./backend run db:migrate:deploy
      - name: Seed auth fixtures
        run: pnpm --filter ./backend run db:seed:auth-e2e
      - name: Start backend
        run: |
          pnpm --filter ./backend run start > /tmp/bjj-backend.log 2>&1 &
          echo $! > /tmp/bjj-backend.pid
      - name: Wait for backend
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/bjj-backend.log
          exit 1
      - name: Install Playwright
        run: pnpm --filter ./frontend exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm --filter ./frontend exec playwright test tests/auth-lifecycle.spec.ts
      - name: Run Release A legacy flag state
        run: pnpm --filter ./frontend exec playwright test tests/agent-release-a.spec.ts
        env:
          RUN_AGENT_E2E: '1'
          NEXT_PUBLIC_AGENT_SHELL_ENABLED: 'false'
      - name: Run Release A shell flag state
        run: pnpm --filter ./frontend exec playwright test tests/agent-release-a.spec.ts
        env:
          RUN_AGENT_E2E: '1'
          NEXT_PUBLIC_AGENT_SHELL_ENABLED: 'true'
      - name: Run Release A real backend stream
        run: pnpm --filter ./frontend exec playwright test tests/agent-release-a.spec.ts
        env:
          RUN_AGENT_REAL_E2E: '1'
          NEXT_PUBLIC_AGENT_SHELL_ENABLED: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-backend-log
          path: /tmp/bjj-backend.log
          retention-days: 30
