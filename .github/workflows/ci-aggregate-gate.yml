name: CI Aggregate Gate

on:
  # Create the stable required context for ordinary pull requests and merge
  # queue entries. Child workflows also emit workflow_run completions below;
  # those rerun this gate as each component finishes.
  pull_request:
    branches: [main, dev, preview]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows:
      - Backend CI
      - Backend Full Flow CI
      - Frontend CI
      - Mobile CI
      - Mobile Unit CI
      - Frontend Playwright Auth Lifecycle
      - Security Review
      - Shared Contracts CI
      - Native Android CI
      - Native iOS CI
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-aggregate-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: ci aggregate gate
    # workflow_run also observes push completions because the child workflows
    # serve branch CI. Only PR and merge-queue runs are release gates.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted aggregate evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # workflow_run executes from the default branch; use that same
          # trusted revision for PR/merge-queue events instead of head code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate component gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -f scripts/ci/aggregate-gate.mjs ]]; then
            node scripts/ci/aggregate-gate.mjs
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            # The evaluator is introduced by this PR, so the trusted default
            # branch cannot contain it yet. This fixed, read-only bootstrap
            # checks the same gates and is eligible only while that exact file
            # is newly added. It never executes PR-controlled source.
            node --input-type=module <<'AGGREGATE_BOOTSTRAP'
            import { readFile } from "node:fs/promises";

            const DEFAULT_API_URL = "https://api.github.com";
            const SUCCESS = "success";
            const EVALUATOR_PATH = "scripts/ci/aggregate-gate.mjs";

            const COMPONENT_GATES = Object.freeze([
                {
                    workflow: "Backend CI",
                    jobs: [
                        "backend · type-check · lint · test",
                        "auth e2e · postgres · valkey · mailpit",
                    ],
                    always: true,
                },
                {
                    workflow: "Frontend CI",
                    jobs: ["frontend · type-check · lint · test · build"],
                    always: true,
                },
                {
                    workflow: "Mobile CI",
                    jobs: [
                        "type-check · lint · test · build",
                        "playwright e2e (advisory · real backend)",
                    ],
                    always: true,
                },
                {
                    workflow: "Frontend Playwright Auth Lifecycle",
                    jobs: ["frontend auth lifecycle · real backend"],
                    always: true,
                },
                {
                    workflow: "Security Review",
                    jobs: ["security-review · osv lockfile scan / osv-scan"],
                    always: true,
                },
                {
                    workflow: "Backend Full Flow CI",
                    jobs: ["backend full flow e2e · local stubs"],
                    paths: [
                        "backend/**",
                        "packages/shared/**",
                        "package.json",
                        "pnpm-lock.yaml",
                        "pnpm-workspace.yaml",
                        "scripts/ci/**",
                        ".github/workflows/backend-full-flow-ci.yml",
                    ],
                },
                {
                    workflow: "Mobile Unit CI",
                    jobs: ["mobile unit tests"],
                    paths: [
                        "mobile/src/**",
                        "mobile/tests/**",
                        "mobile/scripts/**",
                        "mobile/*.config.*",
                        "mobile/*config*",
                        "mobile/*.json",
                        "mobile/package.json",
                        "mobile/next-env.d.ts",
                        "packages/shared/**",
                        "package.json",
                        "pnpm-lock.yaml",
                        "pnpm-workspace.yaml",
                        "scripts/ci/**",
                        ".github/workflows/mobile-unit-ci.yml",
                    ],
                },
                {
                    workflow: "Shared Contracts CI",
                    jobs: ["shared contracts · type-check · test"],
                    paths: [
                        "packages/shared/**",
                        "frontend/**",
                        "mobile/**",
                        "backend/**",
                        "package.json",
                        "pnpm-lock.yaml",
                        "pnpm-workspace.yaml",
                        "scripts/ci/**",
                        ".github/workflows/shared-contracts-ci.yml",
                    ],
                },
                {
                    workflow: "Native Android CI",
                    jobs: ["Android CI", "SCA Scan"],
                    paths: ["native/**"],
                },
                {
                    workflow: "Native iOS CI",
                    jobs: ["iOS CI", "SCA Scan"],
                    paths: ["native/**"],
                },
            ]);

            function requireEnvironment(name) {
                const value = process.env[name];
                if (!value) {
                    throw new Error(`${name} is required`);
                }
                return value;
            }

            function escapeRegExp(value) {
                return value.replace(/[|\\{}()[\]^$+?.]/g, "\\$&");
            }

            function globToRegExp(pattern) {
                let expression = "^";
                for (let index = 0; index < pattern.length; index += 1) {
                    const character = pattern[index];
                    if (character === "*" && pattern[index + 1] === "*") {
                        expression += ".*";
                        index += 1;
                    } else if (character === "*") {
                        expression += "[^/]*";
                    } else if (character === "?") {
                        expression += "[^/]";
                    } else {
                        expression += escapeRegExp(character);
                    }
                }
                return new RegExp(`${expression}$`);
            }

            function requiredGatesForFiles(changedFiles) {
                return COMPONENT_GATES.filter((gate) => (
                    gate.always
                    || changedFiles.some(({ filename }) => gate.paths.some((pattern) => globToRegExp(pattern).test(filename)))
                ));
            }

            function sortKey(run) {
                return [
                    run.run_number ?? 0,
                    run.run_attempt ?? 0,
                    Date.parse(run.updated_at ?? run.created_at ?? "") || 0,
                    run.id ?? 0,
                ];
            }

            function compareRuns(left, right) {
                const leftKey = sortKey(left);
                const rightKey = sortKey(right);
                for (let index = 0; index < leftKey.length; index += 1) {
                    if (leftKey[index] !== rightKey[index]) {
                        return leftKey[index] - rightKey[index];
                    }
                }
                return 0;
            }

            function selectLatestWorkflowRun(runs, workflow, headSha, event) {
                return runs
                    .filter((run) => run.name === workflow && run.head_sha === headSha && run.event === event)
                    .sort(compareRuns)
                    .at(-1);
            }

            async function githubJson(path, token) {
                const apiUrl = (process.env.GITHUB_API_URL || DEFAULT_API_URL).replace(/\/$/, "");
                const response = await fetch(`${apiUrl}${path}`, {
                    headers: {
                        Accept: "application/vnd.github+json",
                        Authorization: `Bearer ${token}`,
                        "X-GitHub-Api-Version": "2022-11-28",
                    },
                });
                const body = await response.text();
                if (!response.ok) {
                    throw new Error(`GitHub API ${response.status} for ${path}`);
                }
                try {
                    return JSON.parse(body);
                } catch {
                    throw new Error(`GitHub API returned invalid JSON for ${path}`);
                }
            }

            async function githubPaginated(path, token) {
                const entries = [];
                for (let page = 1; ; page += 1) {
                    const separator = path.includes("?") ? "&" : "?";
                    const result = await githubJson(`${path}${separator}per_page=100&page=${page}`, token);
                    const pageEntries = Array.isArray(result)
                        ? result
                        : result.workflow_runs ?? result.jobs ?? result.files ?? [];
                    if (!Array.isArray(pageEntries)) {
                        throw new Error(`GitHub API returned an invalid collection for ${path}`);
                    }
                    entries.push(...pageEntries);
                    if (pageEntries.length < 100) {
                        return entries;
                    }
                }
            }

            async function changedFilesForEvent({ eventName, payload, repository, headSha, token }) {
                if (eventName === "pull_request") {
                    const number = payload.pull_request?.number;
                    if (!number) {
                        throw new Error("pull request number is required for aggregate bootstrap");
                    }
                    return githubPaginated(
                        `/repos/${repository}/pulls/${encodeURIComponent(number)}/files`,
                        token,
                    );
                }

                let baseSha = payload.merge_group?.base_sha;
                if (!baseSha) {
                    const commit = await githubJson(
                        `/repos/${repository}/commits/${encodeURIComponent(headSha)}`,
                        token,
                    );
                    baseSha = commit.parents?.[0]?.sha;
                }
                if (!baseSha) {
                    throw new Error(`could not determine merge-group base for ${headSha}`);
                }
                const comparison = await githubJson(
                    `/repos/${repository}/compare/${encodeURIComponent(baseSha)}...${encodeURIComponent(headSha)}`,
                    token,
                );
                if (!Array.isArray(comparison.files)) {
                    throw new Error("GitHub compare response did not include a file inventory");
                }
                return comparison.files;
            }

            async function runBootstrap() {
                const eventName = requireEnvironment("GITHUB_EVENT_NAME");
                const repository = requireEnvironment("GITHUB_REPOSITORY");
                const token = requireEnvironment("GITHUB_TOKEN");
                const payload = JSON.parse(await readFile(requireEnvironment("GITHUB_EVENT_PATH"), "utf8"));
                const headSha = eventName === "pull_request"
                    ? payload.pull_request?.head?.sha
                    : payload.merge_group?.head_sha || process.env.GITHUB_SHA;
                if (!headSha) {
                    throw new Error(`head SHA is required for ${eventName}`);
                }

                const changedFiles = await changedFilesForEvent({ eventName, payload, repository, headSha, token });
                const evaluatorChanges = changedFiles.filter(
                    (file) => file.filename === EVALUATOR_PATH && file.status === "added",
                );
                if (evaluatorChanges.length !== 1) {
                    throw new Error(`${EVALUATOR_PATH} must be added exactly once for the one-time bootstrap`);
                }

                const gates = requiredGatesForFiles(changedFiles);
                const runs = await githubPaginated(
                    `/repos/${repository}/actions/runs?head_sha=${encodeURIComponent(headSha)}`,
                    token,
                );
                const runsByWorkflow = new Map();
                for (const gate of gates) {
                    const run = selectLatestWorkflowRun(runs, gate.workflow, headSha, eventName);
                    if (!run) {
                        continue;
                    }
                    const jobs = await githubPaginated(
                        `/repos/${repository}/actions/runs/${encodeURIComponent(run.id)}/jobs`,
                        token,
                    );
                    runsByWorkflow.set(gate.workflow, { ...run, jobs });
                }

                const failures = [];
                for (const gate of gates) {
                    const run = runsByWorkflow.get(gate.workflow);
                    if (!run) {
                        failures.push(`${gate.workflow}: missing workflow run`);
                        continue;
                    }
                    if (run.status !== "completed") {
                        failures.push(`${gate.workflow}: workflow is ${run.status ?? "unknown"}`);
                        continue;
                    }
                    if (run.conclusion !== SUCCESS) {
                        failures.push(`${gate.workflow}: workflow conclusion is ${run.conclusion ?? "unknown"}`);
                        continue;
                    }
                    for (const expectedJob of gate.jobs) {
                        const matchingJobs = (run.jobs ?? []).filter((job) => job.name === expectedJob);
                        if (matchingJobs.length === 0) {
                            failures.push(`${gate.workflow}: ${expectedJob}: missing job`);
                            continue;
                        }
                        for (const job of matchingJobs) {
                            if (job.status !== "completed") {
                                failures.push(`${gate.workflow}: ${expectedJob}: job is ${job.status ?? "unknown"}`);
                            } else if (job.conclusion !== SUCCESS) {
                                failures.push(`${gate.workflow}: ${expectedJob}: job conclusion is ${job.conclusion ?? "unknown"}`);
                            }
                        }
                    }
                }

                if (failures.length > 0) {
                    throw new Error(failures.join("; "));
                }
                console.log(`CI aggregate bootstrap passed: ${gates.map((gate) => gate.workflow).join(", ")}`);
            }

            runBootstrap().catch((error) => {
                console.error(`::error::CI aggregate bootstrap failed: ${error.message}`);
                process.exitCode = 1;
            });
          AGGREGATE_BOOTSTRAP
          else
            echo "::error::Trusted aggregate evaluator is missing from the default branch"
            exit 1
          fi
