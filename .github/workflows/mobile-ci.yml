name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev, preview, "feature/**", "fix/**" ]
    paths:
      - 'mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-ci.yml'
  # No paths filter on pull_request: this job is a REQUIRED check on dev,
  # so it must report on every PR — path-filtered required checks block
  # merges as eternally "expected" when the paths don't match.
  pull_request:
    branches: [ main, dev, preview, "feature/**", "fix/**" ]
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    name: type-check · lint · test · build
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The e2e copy drift gate diffs against a base commit; the default
          # depth-1 checkout has no history for it to resolve and the gate
          # would silently skip.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast on the cheapest, most deterministic gate first.
      - name: Type check
        run: pnpm --filter ./mobile run type-check

      # The shared package is otherwise only type-checked transitively through
      # its consumers; an orphaned export would ship green (review finding).
      - name: Type check shared package
        run: pnpm --filter @babyjamjam/shared run type-check

      - name: Lint
        run: pnpm --filter ./mobile run lint

      - name: data-component re-entry guard
        run: |
          if grep -rln '\[data-component' mobile/src --include='*.css'; then
            echo '::error::CSS must not select on data-component — use data-slot or a semantic class'; exit 1
          fi
          if grep -rln 'querySelector([^)]*\[data-component' mobile/src --include='*.ts' --include='*.tsx' \
            | grep -v -e '\.test\.' -e '__tests__'; then
            echo '::error::Imperative DOM hooks must not target data-component — use data-slot'; exit 1
          fi

      - name: UI architecture gate
        run: pnpm lint:ui-architecture --platform mobile

      # Reworded UI copy is invisible to the unit tests below — the Playwright
      # specs that assert it only run in the e2e job, against a seeded backend.
      # This catches a stale assertion here in seconds instead of there in
      # minutes. Repo-wide, so it also covers frontend when only this job runs.
      - name: e2e copy drift gate
        run: |
          # A pull request compares against its own base; a push against the
          # head it replaced. Defaulting to origin/dev would compare a dev push
          # to the very commit under test.
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE="HEAD~1" ;;
          esac
          pnpm lint:e2e-strings --base "$BASE"

      - name: Unit tests
        run: pnpm --filter ./mobile test
        env:
          CI: true

      - name: Build
        # The env module (mobile/src/lib/env.ts) fails fast when a production
        # build has no public backend URL. CI builds are compile-only, so a
        # placeholder satisfies validation without implying a real target.
        env:
          NEXT_PUBLIC_API_BASE_URL: https://ci-build.invalid
        run: pnpm --filter ./mobile run build

  # Advisory on PRs: runs the real-backend suite on every pull request (and on
  # manual dispatch), reporting pass/fail as a signal. It is intentionally NOT
  # marked a required check in branch protection, so a red run does not block
  # merges — promote it to required when you want the hard gate. (4 consecutive
  # green runs + 0 flaky as of 2026-06-08.) No continue-on-error: the status
  # must stay truthful (red when it fails) for the signal to be worth anything.
  e2e:
    name: playwright e2e (advisory · real backend)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    needs: verify
    # 90: the full 266-test suite against the real stack needs headroom —
    # two 60-minute runs were cancelled mid-suite before any report upload.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_URL: http://localhost:3002
      CI: true
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      DEVELOPMENT_API_BASE_URL: http://localhost:3001
      # required by mobile env validation when the app builds/serves as production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      DEVELOPMENT_FRONTEND_URL: http://localhost:3000
      DEVELOPMENT_MOBILE_FRONTEND_URL: http://localhost:3002
      DIRECT_URL: postgresql://postgres@localhost:5432/postgres
      E2E_VENDOR_STUBS: '1'
      # Webhook guard inputs for the critical-flows spec — e2e-only literals,
      # not real secrets (the CI backend never talks to real eformsign).
      EFORMSIGN_COMPANY_ID: e2e-stub-company
      EFORMSIGN_WEBHOOK_SECRET: e2e-dummy-webhook-${{ github.run_id }}
      # PR-controlled E2E code gets only a per-run dummy; no repository JWT secret.
      JWT_SECRET: e2e-dummy-jwt-signing-key-at-least-32-${{ github.run_id }}
      AUTH_EMAIL_TOKEN_HMAC_SECRET: e2e-dummy-email-hmac-${{ github.run_id }}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      VALKEY_URL: redis://localhost:6379
      NODE_ENV: development
      STORAGE_BOOTSTRAP_DISABLED: '1'
    services:
      postgres:
        image: postgres@sha256:c1b3783309b6499c795eed7c20135a1a4d25cae1b575c3d52c6f536129a1b109 # postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84 # valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68 # axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history; the changed-spec selection below no longer depends on it
          # (it asks the API instead), but keep it so any future git-based step works.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter ./backend run db:migrate:deploy

      - name: Seed e2e fixtures
        run: |
          pnpm --filter ./backend run db:seed:e2e
          pnpm --filter ./backend run db:seed:auth-e2e

      - name: Start backend
        run: |
          pnpm --filter ./backend run start > /tmp/bjj-backend.log 2>&1 &
          echo $! > /tmp/bjj-backend.pid

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Backend failed to become ready"
          cat /tmp/bjj-backend.log
          exit 1

      - name: Build mobile app (production, E2E flags inlined)
        env:
          NEXT_PUBLIC_E2E_TEST: 'true'
          # the job-level NODE_ENV=development is for the backend; the Next build
          # and the `next start` webServer must run as production
          NODE_ENV: production
        run: pnpm --filter ./mobile exec next build

      - name: Install Playwright browsers
        run: pnpm --filter ./mobile exec playwright install --with-deps chromium

      # The full suite on every trigger, PRs included.
      #
      # PR runs used to execute only the specs the PR itself touched, on the theory
      # that the post-merge push to dev would catch the rest. It does — four days
      # late, and only if someone reads an advisory check. Worse, the specs a change
      # breaks are exactly the ones it does NOT touch: 8601e809b moved the contracts
      # template filter from the client to the server across 25 files, none of them
      # under mobile/tests, so its three affected specs were invisible until the
      # post-merge run went red and stayed red for ten pushes. A file-list allowlist
      # ("also run everything when mobile/src/services/api.ts changes") would drift
      # the same way the mock did.
      #
      # The whole suite is ~1m45s of the job's ~5m; skipping it bought almost nothing
      # and cost the only pre-merge signal this job has.
      - name: Playwright tests
        run: pnpm --filter ./mobile run test:e2e

      - name: Rebuild mobile app with operational copilot shell
        env:
          NEXT_PUBLIC_E2E_TEST: 'true'
          NEXT_PUBLIC_AGENT_SHELL_ENABLED: 'true'
          NODE_ENV: production
        run: pnpm --filter ./mobile exec next build

      - name: Run mobile operational copilot against the real backend
        env:
          RUN_AGENT_REAL_E2E: '1'
        run: pnpm --filter ./mobile exec playwright test tests/agent-real-backend.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mobile-playwright-report
          path: mobile/playwright-report/
          retention-days: 30

      - name: Upload backend log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mobile-backend-log
          path: /tmp/bjj-backend.log
          retention-days: 30
