name: ${COMPOSE_PROJECT_NAME:-babyjamjam-backend}

services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile.lightsail
    image: ${BACKEND_IMAGE:-babyjamjam-backend}:${BACKEND_IMAGE_TAG:-local}
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/babyjamjam/backend.env}
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "3001"
      NODE_ENV: production
      VALKEY_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    expose:
      - "3001"
    init: true
    restart: unless-stopped
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536m}
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    networks:
      backend:
      edge:
        aliases:
          - ${BACKEND_NETWORK_ALIAS:-api}

  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    restart: unless-stopped
    cpus: ${VALKEY_CPU_LIMIT:-0.25}
    mem_limit: ${VALKEY_MEMORY_LIMIT:-128m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - valkey_data:/data
    networks:
      - backend

networks:
  backend:
  edge:
    name: ${LIGHTSAIL_EDGE_NETWORK:-babyjamjam-edge}
    external: true

volumes:
  valkey_data:
    name: ${VALKEY_DATA_VOLUME:-babyjamjam-backend-production_valkey_data}
    external: true
