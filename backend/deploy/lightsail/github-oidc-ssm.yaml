AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege GitHub OIDC and SSM deployment roles for BabyJamJam Lightsail.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the existing token.actions.githubusercontent.com OIDC provider.
    AllowedPattern: "^arn:[a-z0-9-]+:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$"
  ManagedNodeTagValue:
    Type: String
    Default: babyjamjam-admin-server
    AllowedValues:
      - babyjamjam-admin-server
    Description: Fixed DeploymentTarget tag on the single shared SSM managed Lightsail node.
    AllowedPattern: "^[A-Za-z0-9._:/=+@-]{1,128}$"

Resources:
  ManagedNodeServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets the registered Lightsail hybrid node communicate with AWS Systems Manager.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  PreviewDeployDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Deploy one validated BabyJamJam preview backend image.
        parameters:
          CommitSha:
            type: String
            allowedPattern: "^[0-9a-f]{40}$"
          ImageDigest:
            type: String
            allowedPattern: "^sha256:[0-9a-f]{64}$"
        mainSteps:
          - action: aws:runShellScript
            name: deployPreview
            inputs:
              timeoutSeconds: "1800"
              runCommand:
                - '/usr/local/sbin/babyjamjam-ci-operator deploy preview "{{ CommitSha }}" "{{ ImageDigest }}"'

  ProductionDeployDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Deploy one validated BabyJamJam production backend image.
        parameters:
          CommitSha:
            type: String
            allowedPattern: "^[0-9a-f]{40}$"
          ImageDigest:
            type: String
            allowedPattern: "^sha256:[0-9a-f]{64}$"
        mainSteps:
          - action: aws:runShellScript
            name: deployProduction
            inputs:
              timeoutSeconds: "1800"
              runCommand:
                - '/usr/local/sbin/babyjamjam-ci-operator deploy production "{{ CommitSha }}" "{{ ImageDigest }}"'

  PreviewStatusDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Read the validated BabyJamJam preview runtime status.
        mainSteps:
          - action: aws:runShellScript
            name: statusPreview
            inputs:
              timeoutSeconds: "120"
              runCommand:
                - '/usr/local/sbin/babyjamjam-ci-operator status preview'

  ProductionStatusDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Read the validated BabyJamJam production runtime status.
        mainSteps:
          - action: aws:runShellScript
            name: statusProduction
            inputs:
              timeoutSeconds: "120"
              runCommand:
                - '/usr/local/sbin/babyjamjam-ci-operator status production'

  OperatorUpgradeDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Replace the shared root operator from the exact protected main commit.
        parameters:
          CommitSha:
            type: String
            allowedPattern: "^[0-9a-f]{40}$"
        mainSteps:
          - action: aws:runShellScript
            name: upgradeSharedOperator
            inputs:
              timeoutSeconds: "600"
              runCommand:
                - |
                  set -euo pipefail
                  readonly repository_url="https://github.com/jaino-song/babyjamjam-admin.git"
                  readonly expected_sha="{{ CommitSha }}"
                  upgrade_root="$(/usr/bin/mktemp -d /var/tmp/babyjamjam-operator-upgrade.XXXXXX)"
                  trap '/bin/rm -rf "$upgrade_root"' EXIT
                  /usr/bin/git init --quiet "$upgrade_root/repository"
                  /usr/bin/git -C "$upgrade_root/repository" remote add origin "$repository_url"
                  /usr/bin/git -C "$upgrade_root/repository" -c protocol.file.allow=never \
                    fetch --quiet --depth 1 origin refs/heads/main
                  fetched_sha="$(/usr/bin/git -C "$upgrade_root/repository" rev-parse FETCH_HEAD)"
                  [[ "$fetched_sha" == "$expected_sha" ]] || {
                    echo "origin/main mismatch; refusing operator replacement." >&2
                    exit 1
                  }
                  /usr/bin/git -C "$upgrade_root/repository" checkout --quiet --detach "$fetched_sha"
                  "$upgrade_root/repository/backend/deploy/lightsail/install-ci-operator.sh" install --replace
                  "$upgrade_root/repository/backend/deploy/lightsail/install-ci-operator.sh" check
                  printf '%s\n' 'operator_upgrade=ok'

  PreviewDbReconcileDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: babyjamjam-preview-db-failover
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Reconcile the BabyJamJam preview database route from the fixed host operator.
        parameters:
          RequestId:
            type: String
            allowedPattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        mainSteps:
          - action: aws:runShellScript
            name: reconcilePreviewDatabaseRoute
            inputs:
              timeoutSeconds: "120"
              runCommand:
                - '/usr/local/sbin/babyjamjam-ci-operator db-reconcile preview "{{ RequestId }}"'

  ProductionDbReconcileDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: babyjamjam-production-db-failover
      DocumentType: Command
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: Reconcile the BabyJamJam production database route from the fixed host operator.
        parameters:
          RequestId:
            type: String
            allowedPattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        mainSteps:
          - action: aws:runShellScript
            name: reconcileProductionDatabaseRoute
            inputs:
              timeoutSeconds: "120"
              runCommand:
                - '/usr/local/sbin/babyjamjam-ci-operator db-reconcile production "{{ RequestId }}"'

  PreviewDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub preview branch may invoke only the preview SSM deployment document.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": repo:jaino-song/babyjamjam-admin:ref:refs/heads/preview
      Policies:
        - PolicyName: InvokePreviewDeployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UsePreviewDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${PreviewDeployDocument}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${PreviewStatusDocument}
              - Sid: TargetDeploymentNode
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:managed-instance/*
                Condition:
                  StringEquals:
                    "ssm:resourceTag/DeploymentTarget": !Ref ManagedNodeTagValue
              - Sid: ObserveOwnCommand
                Effect: Allow
                Action:
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

  ProductionDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub main branch may invoke only the production SSM deployment document.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": repo:jaino-song/babyjamjam-admin:ref:refs/heads/main
      Policies:
        - PolicyName: InvokeProductionDeployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UseProductionDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ProductionDeployDocument}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ProductionStatusDocument}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${OperatorUpgradeDocument}
              - Sid: TargetDeploymentNode
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:managed-instance/*
                Condition:
                  StringEquals:
                    "ssm:resourceTag/DeploymentTarget": !Ref ManagedNodeTagValue
              - Sid: ObserveOwnCommand
                Effect: Allow
                Action:
                  - ssm:DescribeInstanceInformation
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

Outputs:
  DeploymentTargetTagValue:
    Description: Set as the LIGHTSAIL_SSM_TARGET_TAG GitHub repository variable.
    Value: !Ref ManagedNodeTagValue
  ManagedNodeServiceRoleName:
    Description: Use this role when creating the one-time SSM hybrid activation.
    Value: !Ref ManagedNodeServiceRole
  PreviewDeployRoleArn:
    Description: Set as the AWS_PREVIEW_DEPLOY_ROLE_ARN GitHub repository variable.
    Value: !GetAtt PreviewDeployRole.Arn
  PreviewDeployDocumentName:
    Description: Set as the AWS_PREVIEW_DEPLOY_DOCUMENT_NAME GitHub repository variable.
    Value: !Ref PreviewDeployDocument
  PreviewStatusDocumentName:
    Description: Set as the AWS_PREVIEW_STATUS_DOCUMENT_NAME GitHub repository variable.
    Value: !Ref PreviewStatusDocument
  ProductionDeployRoleArn:
    Description: Set as the AWS_PRODUCTION_DEPLOY_ROLE_ARN GitHub repository variable.
    Value: !GetAtt ProductionDeployRole.Arn
  ProductionDeployDocumentName:
    Description: Set as the AWS_PRODUCTION_DEPLOY_DOCUMENT_NAME GitHub repository variable.
    Value: !Ref ProductionDeployDocument
  ProductionStatusDocumentName:
    Description: Set as the AWS_PRODUCTION_STATUS_DOCUMENT_NAME GitHub repository variable.
    Value: !Ref ProductionStatusDocument
  OperatorUpgradeDocumentName:
    Description: Set as the AWS_OPERATOR_UPGRADE_DOCUMENT_NAME GitHub repository variable.
    Value: !Ref OperatorUpgradeDocument
  PreviewDbReconcileDocumentArn:
    Description: Fixed preview database-route reconcile document ARN for the failover worker policy.
    Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${PreviewDbReconcileDocument}
  PreviewDbReconcileDocumentName:
    Description: Fixed preview database-route reconcile document name for the failover worker.
    Value: !Ref PreviewDbReconcileDocument
  ProductionDbReconcileDocumentArn:
    Description: Fixed production database-route reconcile document ARN for the failover worker policy.
    Value: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ProductionDbReconcileDocument}
  ProductionDbReconcileDocumentName:
    Description: Fixed production database-route reconcile document name for the failover worker.
    Value: !Ref ProductionDbReconcileDocument
